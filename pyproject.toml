[project]
name = "rediauto"
version = "0.1.0"
description = "Reposiciona janelas automaticamente para preencher o espaco livre da tela no Windows"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pystray>=0.19.5",
    "pywin32>=312",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
]
